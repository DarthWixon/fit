# Example plan description for `fit train import`. The plan itself — StrongLifts
# 5x5 on Mon/Wed/Fri with easy rides on Thu, Sat and Sun — is fixed; this only
# dates it. start_date and end_date are required.
#
#   fit train import examples/training-plan.yaml

start_date: 2026-11-04
end_date: 2027-01-31          # the plan's last day

# Optional. Training days a week, default 6. A range — [5, 6] — opens with the
# Thursday and Sunday rides and adds Saturday's later.
days_per_week: [5, 6]

# Optional. Percent of the opening week's riding. Without it, fit measures your
# average weekly riding over the last 8 weeks and sizes the opening week to
# match, converging back to the plan's own level by the end.
# volume: 70

# Optional. An e1RM goal per lift; each lift stops progressing when it gets
# there. Without one, the lift climbs for the whole plan.
# targets:
#   squat_goal_kg: 105
#   bench_press_goal_kg: 50
#   deadlift_goal_kg: 130
#   shoulder_press_goal_kg: 42
#   row_goal_kg: 60
