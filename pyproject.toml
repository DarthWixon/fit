[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fit"
version = "0.1.0"
description = "Local-first terminal workout tracker"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "fitparse>=1.2,<2.0",
]

[project.optional-dependencies]
garmin = ["garminconnect>=0.2,<1.0"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
fit = "fit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fit"]

[tool.pytest.ini_options]
# fitparse (pinned <2.0) uses deprecated datetime APIs internally; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:fitparse"]
