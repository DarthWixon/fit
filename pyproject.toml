[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fit"
version = "0.1.0"
description = "Local-first terminal workout tracker"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "fitparse>=1.2,<2.0",
]

[project.optional-dependencies]
garmin = ["garminconnect>=0.3,<1.0"]  # 0.3 added delete_workout
# `fit train import` parses a YAML plan description; show/sync/clear read the
# stored JSON and need nothing extra. Deliberately opt-in, like [garmin].
train = ["pyyaml>=6.0,<7.0"]
dev = [
    "pytest>=8.0,<9.0",
    # Formats and lints in one tool, replacing black + isort.
    "ruff>=0.17,<0.18",
    # Type checks the annotations, which nothing else verifies. The [nodejs]
    # extra ships Node as a wheel, so pyright needs no system Node and does
    # not download one on first run.
    "pyright[nodejs]>=1.1.414,<1.2",
]

[project.scripts]
fit = "fit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fit"]

# ruff format's defaults (88 columns, target inferred from requires-python)
# match the black style the codebase was written in.
[tool.ruff.lint]
# E4/E7/E9 + F are ruff's defaults; I sorts imports (was isort); B catches
# likely bugs; UP keeps syntax current for 3.11. No E501: the formatter owns
# line length, and long strings it cannot split are left alone.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# fitparse (pinned <2.0) uses deprecated datetime APIs internally; not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:fitparse"]
